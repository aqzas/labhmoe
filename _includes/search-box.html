{% include i18n.html %}
<div class="search-box">
  <input
    type="text"
    class="search-input"
    oninput="onSearchInput(this)"
    placeholder="{{ ui.search_placeholder }}"
    aria-label="{{ ui.search_placeholder }}"
  />
  <button
    disabled
    data-tooltip="{{ ui.clear_search }}"
    aria-label="{{ ui.clear_search }}"
    onclick="onSearchClear()"
  >
    {% include icon.html icon="fa-solid fa-magnifying-glass" %}
  </button>
</div>
