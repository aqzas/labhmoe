{% include i18n.html %}
<form onsubmit="onSiteSearchSubmit(event)">
  <input type="text" name="query" placeholder="{{ ui.site_search }}" aria-label="{{ ui.site_search }}" />
  <button type="submit" class="button" aria-label="{{ ui.search }}">
    {% include icon.html icon="fa-solid fa-magnifying-glass" %}
  </button>
</form>
