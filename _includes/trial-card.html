<article class="trial-card" id="{{ include.trial.id | escape }}" data-product-type="{{ include.trial.product_type | escape }}" aria-labelledby="{{ include.trial.id | escape }}-title">
  <div class="trial-card__meta">
    <span class="trial-card__type" aria-label="产品类型">{{ include.trial.product_type | escape }}</span>
    <span class="trial-card__phase" aria-label="临床分期">{{ include.trial.phase | escape }}</span>
  </div>
  <h2 class="trial-card__title" id="{{ include.trial.id | escape }}-title">{{ include.trial.title | escape }}</h2>
  <dl class="trial-card__fields">
    <div>
      <dt>适应症</dt>
      <dd class="trial-card__indication">{{ include.trial.indication | escape }}</dd>
    </div>
    <div>
      <dt>药物干预手段</dt>
      <dd class="trial-card__intervention">{{ include.trial.intervention | escape }}</dd>
    </div>
  </dl>
</article>
