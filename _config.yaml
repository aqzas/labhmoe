  # site properties and page defaults
title: UnionCell lab
lang: en
subtitle: 
description: 
header: images/home/image1.jpg
footer: images/home/image1.jpg
proofer: false

# site social media and other links
links:
  email: qiubaili@hust.edu.cn


### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
      lang: en
  - scope:
      path: "zh"
    values:
      lang: zh-CN
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # 成员信息仅供团队列表使用，不生成独立资料页
  members:
    output: false
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - docs
  - tools
