- title: 干细胞与外泌体治疗
  subtitle: 探索干细胞与外泌体在复杂疾病治疗中的潜力
  group: featured
  image: images/projects/msc.png
  link: https://github.com/
  description: 实验室长期专注于血液及免疫相关疾病的诊疗，尤其在骨髓和免疫系统的衰老机制及损伤修复领域有深入研究。作为干细胞及其细胞外囊泡（EVs）的资深研究团队，我们致力于通过创新性临床研究，解决免疫疾病、肿瘤等复杂疾病的诊疗难题。团队开展EVs的生物学特征及其临床应用的基础原创性研究已逾15年，取得了一系列国际领先的成果。
  tags:
    - resource

- title: 白血病与骨髓瘤机制
  subtitle: 揭示白血病和骨髓瘤的新机制与治疗靶点
  group: featured
  image: images/projects/myeloma.png
  link: https://github.com/
  description: 实验室团队率先发现白血病EVs能够将正常干细胞移植物转变为癌细胞，揭示了供体细胞白血病的全新机制。2014年受日本第37届造血细胞移植年会主席Ogawa教授之邀作大会发言；率先阐明骨髓瘤EVs的特征和功能，提供了新的发病机制、分子标志物和治疗靶点。
  tags:
    - resource

- title: 临床转化与产业化
  subtitle: 推动干细胞及EVs的产业化和临床转化
  image: images/projects/translation.png
  link: https://github.com/
  description: 李秋柏教授团队立足于“产-学-研-医”的深度融合，从临床问题出发，聚焦于干细胞来源EVs的新型生物药研发，主攻关键制备技术和临床颠覆性转化应用，致力于实现干细胞EVs新药“0”的突破，解决复杂疾病的诊疗难题。牵头的十四五国家重点研发计划研究与器官修复专项（2021-2026,7350万），为科技部首个以干细胞和EVs新药研发临床试验IND批件为考核目标大项目。创建了省发改委“细胞外囊泡转化应用湖北省工程研究中心”、一级EVs学会“湖北省细胞外囊泡学会”及其转化医学研究与应用专委会。
  tags:
    - resource
    - publication

- title: 衰老与组织修复
  subtitle: 延缓衰老的全新“武器”——脐带干细胞来源EVs
  image: images/projects/aging.png
  link: https://github.com/
  description: 我们发现脐带干细胞来源的EVs富含“年轻因子”，能够显著逆转骨髓干细胞的衰老，并延缓年老小鼠器官退行性变。这一发现为抗衰老领域提供了全新的治疗方法，并在顶级转化医学期刊《Sci Transl Med》发表后，成为高被引论文。该研究不仅揭示了EVs在延缓机体老化中的潜力，还为未来衰老相关疾病的治疗奠定了基础。
  tags:
    - software

- title: 工程化EVs治疗
  subtitle: 工程化EVs与新型治疗手段的突破
  image: images/projects/engineered-evs.jpg
  link: https://github.com/
  description: 团队成功构建了CD38抗原受体高表达的工程化EVs，能够有效逆转肺泡上皮细胞的衰老和肺纤维化。这项研究为老年性和结缔组织疾病相关的肺纤维化治疗提供了创新方案，并已申报发明专利，研究成果发表于美国化学学会期刊《ACS Nano》。此外，李教授团队还首次提出并验证了基于EVs动态监测干细胞功能状态的新方法，利用荧光分子层析（FMT）技术解决了EVs体内示踪成像的难题。
  tags:
    - software